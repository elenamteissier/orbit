<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit</title>
<meta name="author" content="Elena Teissier">
<meta name="description" content="Orbit: a space-themed progress tracker. Projects are planets, sub-projects are moons, tasks are stars.">
<style>
:root{
  --s:124px;--sun:168px;
  --p0:#12d6ff;--p1:#3a7bff;--p2:#9b5cff;--p3:#ff4fd8;--p4:#ff3b5c;--p5:#ff8a1f;--p6:#ffd400;--p7:#3be36b;
  --ink:#eef1ff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#0e1522 0%,#05070b 70%) #05070b;color:var(--ink);
  font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- background ---------- */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;transition:filter 1s}
.bg .blob{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(130px);opacity:.07;
  animation:drift 26s ease-in-out infinite alternate;transition:background 1s}
.bg .b1{background:var(--p1);left:-15vmax;top:-20vmax}
.bg .b2{background:var(--p3);right:-20vmax;top:10vmax;animation-delay:-9s}
.bg .b3{background:var(--p0);left:15vmax;bottom:-30vmax;animation-delay:-17s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.bg::before{content:'';position:absolute;inset:0;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:56px 56px;-webkit-mask:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%);mask:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%)}
.layer{position:absolute;inset:-40px;will-change:transform}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.15;transform:scale(.7)}to{opacity:1;transform:scale(1.25)}}
.shoot{position:absolute;height:1.5px;width:130px;background:linear-gradient(90deg,transparent,#fff);opacity:0;animation:shoot 1.4s ease-out forwards}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(var(--r))}12%{opacity:.9}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}

/* ---------- header ---------- */
header{position:fixed;top:0;left:0;right:0;height:64px;z-index:30;display:flex;align-items:center;gap:10px;padding:0 16px;
  background:linear-gradient(180deg,rgba(8,12,28,.85),rgba(8,12,28,0));}
.crumbs{display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.crumbs button{background:none;border:0;padding:6px 10px;border-radius:999px;opacity:.75;transition:.2s}
.crumbs button:hover{opacity:1;background:rgba(255,255,255,.1)}
.crumbs .cur{font-weight:700;opacity:1;cursor:default}
.crumbs .sep{opacity:.35}
.btn{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:8px 14px;
  backdrop-filter:blur(8px);transition:.2s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
.btn[disabled]{opacity:.3;pointer-events:none}
.btn.primary{background:var(--p0);border:0;color:#05070b;font-weight:600}
.pal{position:relative}
.pal-menu{position:absolute;right:0;top:44px;background:rgba(16,20,44,.95);border:1px solid rgba(255,255,255,.15);
  border-radius:16px;padding:8px;display:none;min-width:190px;max-height:70vh;overflow-y:auto;backdrop-filter:blur(12px);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.pal-menu.open{display:block;animation:fade .2s}
.pal-menu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:8px 10px;border-radius:10px;text-align:left}
.pal-menu button:hover,.pal-menu button.on{background:rgba(255,255,255,.1)}
.dots{display:flex}
.dots i{width:14px;height:14px;border-radius:50%;margin-right:-4px;border:2px solid #12163a}

/* ---------- stage ---------- */
#stage{position:fixed;left:0;right:0;top:64px;bottom:0;z-index:5}
#stage.leave-in{transform-origin:50% 90%;animation:leaveIn .32s ease-in forwards}
#stage.enter-in{transform-origin:50% 90%;animation:enterIn .55s cubic-bezier(.2,.8,.2,1)}
#stage.leave-warp{animation:leaveWarp .32s ease-in forwards}
#stage.enter-warp{animation:enterWarp .75s cubic-bezier(.16,.84,.24,1)}
@keyframes leaveWarp{to{opacity:0;transform:scale(1.4);filter:blur(12px) brightness(1.6)}}
@keyframes enterWarp{from{opacity:0;transform:scale(.62);filter:blur(12px) brightness(1.6)}60%{filter:blur(0) brightness(1.1)}to{opacity:1;transform:none;filter:none}}
#stage.leave-out{animation:leaveOut .32s ease-in forwards}
#stage.enter-out{animation:enterOut .55s cubic-bezier(.2,.8,.2,1)}
@keyframes leaveIn{to{transform:scale(2.6);opacity:0;filter:blur(8px)}}
@keyframes enterIn{from{transform:scale(.3);opacity:0;filter:blur(8px)}}
@keyframes leaveOut{to{transform:scale(.3);opacity:0;filter:blur(8px)}}
@keyframes enterOut{from{transform:scale(2.6);opacity:0;filter:blur(8px)}}

#detail{position:fixed;top:64px;left:0;right:0;z-index:6;text-align:center;pointer-events:none;padding:6px 16px;display:none}
#detail h1{margin:0;font-size:clamp(24px,3.6vw,38px);font-weight:300;letter-spacing:6px;text-transform:uppercase;text-shadow:0 0 24px color-mix(in srgb,var(--dc,#fff) 25%,transparent)}
#detail .bar{width:min(320px,70vw);height:2px;border-radius:99px;background:rgba(255,255,255,.12);margin:10px auto 4px;overflow:hidden}
#detail .bar i{display:block;height:100%;background:var(--dc,#fff);border-radius:99px;transition:width .6s}
#detail small{opacity:.7}

.bubble{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);
  touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.bubble.dragging{z-index:20;cursor:grabbing}
.bubble.ghost{opacity:0;pointer-events:none}
.float{width:100%;height:100%;position:relative;animation:bob 6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-8px)}to{transform:translateY(8px)}}
.orb{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;
  background:rgba(255,255,255,.025);
  border:1px solid color-mix(in srgb,var(--c) 95%,transparent);
  box-shadow:0 0 22px color-mix(in srgb,var(--c) 28%,transparent);
  transition:transform .25s cubic-bezier(.3,1.4,.5,1),background .6s,border-color .6s,box-shadow .6s}
.bubble:hover .orb{transform:scale(1.06)}
.dragging .orb{transform:scale(1.12)!important}
.fill{position:absolute;left:0;right:0;bottom:0;transition:height .6s cubic-bezier(.3,1.3,.5,1)}
.liq{position:absolute;left:-60%;right:-60%;top:0;height:420px;transform-origin:50% 0;
  background:color-mix(in srgb,var(--c) 46%,transparent);border-top:1px solid var(--c);
  transform:translateY(var(--lift,0px)) rotate(var(--tilt,0deg));transition:background .6s}
.liq.b{top:-3px;background:color-mix(in srgb,var(--c) 24%,transparent);border-top:1px solid color-mix(in srgb,var(--c) 45%,transparent);
  transform:translateY(calc(var(--lift,0px)*-.6)) rotate(var(--tilt2,0deg))}
.sun .liq,.big .liq{animation:sway 7s ease-in-out infinite alternate}
.sun .liq.b,.big .liq.b{animation-duration:9s;animation-direction:alternate-reverse}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.fill.empty{display:none}
.shine{display:none}
.label{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center;
  letter-spacing:.3px}
.label b{font-size:14px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.label small{font-size:11px;opacity:.6;margin-top:4px}
.kids{position:absolute;right:2px;top:4px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;font-size:11px;
  display:grid;place-items:center;background:rgba(8,12,28,.55);border:1px solid rgba(255,255,255,.25)}
.pop .orb{animation:pop .7s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{from{transform:scale(0)}60%{transform:scale(1.2)}}
.sucked{transition:transform .6s cubic-bezier(.5,0,.9,.6);pointer-events:none}
.sucked .orb{transform:scale(.15)!important;opacity:0;transition:transform .6s ease-in,opacity .5s .1s ease-in}

/* ---------- hole ---------- */
#hole{position:fixed;left:50%;bottom:22px;width:150px;height:150px;margin-left:-75px;z-index:4;pointer-events:none;opacity:.7;transition:opacity .3s,transform .4s cubic-bezier(.3,1.3,.5,1)}
#hole .horizon{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:#000;
  border:1px solid color-mix(in srgb,var(--p0) 70%,transparent);animation:hpulse 5s ease-in-out infinite alternate;transition:box-shadow .4s,border-color .4s}
@keyframes hpulse{from{box-shadow:0 0 0 6px rgba(255,255,255,.015),0 0 18px color-mix(in srgb,var(--p0) 12%,transparent)}to{box-shadow:0 0 0 12px rgba(255,255,255,.03),0 0 30px color-mix(in srgb,var(--p0) 22%,transparent)}}
#hole span{position:absolute;left:0;right:0;bottom:-12px;text-align:center;font-size:10px;letter-spacing:2px;opacity:0;transition:.3s}
#hole.show{opacity:1}
#hole.show span{opacity:.7}
#hole.hot{transform:scale(1.18)}
#hole.hot .horizon{animation:none;border-color:var(--p0);box-shadow:0 0 0 10px color-mix(in srgb,var(--p0) 10%,transparent),0 0 36px color-mix(in srgb,var(--p0) 35%,transparent)}

/* ---------- overlay ---------- */
#overlay{position:fixed;inset:0;z-index:50;background:rgba(5,8,20,.62);backdrop-filter:blur(10px);
  display:flex;animation:fade .25s;overflow:auto}
@keyframes fade{from{opacity:0}}
.panel{width:min(420px,92vw);margin:auto;text-align:center;padding:10px;animation:rise .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes rise{from{transform:scale(.4);opacity:0}}
.big{position:relative;width:300px;height:300px;margin:0 auto 12px}
.big svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
.big.locked svg{pointer-events:none}
.big .orb{position:absolute;inset:34px;width:auto;height:auto}
.big .orb:hover{transform:none}
.pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:56px;font-weight:200;text-shadow:0 2px 14px rgba(0,0,0,.55);pointer-events:none}
.pct small{font-size:12px;font-weight:500;opacity:.85;margin-top:-4px}
.name{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:14px;color:var(--ink);
  padding:11px 14px;font-size:18px;text-align:center;outline:none;font-weight:600}
.name:focus{border-color:var(--c)}
input[type=range]{width:100%;margin:16px 0 6px;accent-color:var(--c)}
input[type=range]:disabled{opacity:.3}
.sw{display:flex;justify-content:center;gap:8px;margin:10px 0 14px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;transition:.2s}
.sw button:hover{transform:scale(1.2)}
.sw button.on{border-color:#fff;transform:scale(1.15)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;opacity:.85;cursor:pointer}
.danger{border-color:rgba(255,110,110,.5);color:#ff9a9a}
.newcard{width:min(360px,92vw);margin:auto;padding:22px;border-radius:14px;background:rgba(18,22,52,.9);border:1px solid rgba(255,255,255,.15);
  box-shadow:0 30px 80px rgba(0,0,0,.5);text-align:center;animation:rise .45s cubic-bezier(.3,1.5,.5,1)}
.newcard h3{margin:0 0 12px}

.notes{width:100%;margin-top:10px;min-height:88px;resize:vertical;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);
  border-radius:8px;color:var(--ink);font:inherit;font-size:13px;line-height:1.6;padding:10px 12px;text-align:left;outline:none;transition:border-color .2s}
.notes:focus{border-color:var(--c)}
.notes::placeholder,#noteArea::placeholder{color:rgba(238,241,255,.35)}
.orbits{position:absolute;inset:0;pointer-events:none}
.orbits ellipse{fill:none;stroke:rgba(255,255,255,.08);stroke-width:1;stroke-dasharray:2 7}
.sun{position:absolute;left:50%;top:50%;width:var(--sun);height:var(--sun);margin:calc(var(--sun)/-2) 0 0 calc(var(--sun)/-2);z-index:0;cursor:default}
.sun.back{cursor:pointer}
.sun .orb{border-color:var(--c);box-shadow:0 0 40px color-mix(in srgb,var(--c) 26%,transparent)}
.sun.back:hover .orb{transform:scale(1.04)}
.sunglow{position:absolute;inset:-34px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 20%,transparent),transparent 68%);animation:sunpulse 6s ease-in-out infinite alternate;pointer-events:none}
@keyframes sunpulse{from{opacity:.55;transform:scale(.96)}to{opacity:1;transform:scale(1.06)}}
.sun.home{width:calc(var(--sun) + 24px);height:calc(var(--sun) + 24px);margin:calc((var(--sun) + 24px)/-2) 0 0 calc((var(--sun) + 24px)/-2)}
.sun.home .sunglow{inset:-95px;background:radial-gradient(circle,rgba(255,180,40,.34),rgba(255,120,20,.12) 48%,transparent 70%)}
.sun.home .orb{border:0;background:#ffb703;box-shadow:0 0 38px 6px rgba(255,170,30,.5),0 0 100px 26px rgba(255,120,20,.22)}
.sun.home .fill{display:none}
.sun.home .label{color:#1a1000;text-shadow:none}
.sun.home .label b{font-size:16px;font-weight:600}
.sun.home .label small{display:none}
.sun.home .sunring{display:none}
.sun.home{cursor:text}
.sunring{position:absolute;inset:-16px;width:calc(100% + 32px);height:calc(100% + 32px);transform:rotate(-90deg);pointer-events:none;overflow:visible}
.sunring circle{fill:none;stroke-linecap:round}
.sunring .t{stroke:rgba(255,183,3,.18);stroke-width:.6}
.sunring .a{stroke:#ffb703;stroke-width:1}
.sun .label b{font-size:16px;letter-spacing:.6px}
.sun .label small{font-size:12px}
.moon{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;cursor:pointer;
  border:1px solid color-mix(in srgb,var(--c) 90%,transparent);background:rgba(8,12,20,.65);box-shadow:0 0 10px color-mix(in srgb,var(--c) 30%,transparent)}
.moon::before{content:'';position:absolute;inset:-6px;border-radius:50%}
.moon .mw{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.moon .mf{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--c) 60%,transparent);border-top:1px solid var(--c)}
.moon::after{content:attr(data-n);position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:6px;font-size:10px;letter-spacing:.5px;white-space:nowrap;
  padding:2px 7px;border-radius:4px;background:rgba(8,12,20,.9);border:1px solid rgba(255,255,255,.12);opacity:0;pointer-events:none;transition:opacity .15s}
.moon:hover{z-index:6!important}
.moon:hover::after{opacity:1}
.btn#lf.on{border-color:rgba(126,231,135,.55);color:#7ee787}
#timeline{position:fixed;top:64px;left:0;right:0;height:124px;z-index:6;display:block;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
body.tl #stage{top:188px}
body.tl #detail{top:188px}
.tl-empty{position:absolute;top:48px;left:16px;font-size:12px;opacity:.5;white-space:nowrap;position:sticky;left:16px}
.tl-in{position:relative;height:108px}
.tl-axis{position:absolute;left:0;right:0;top:86px;height:1px;background:rgba(255,255,255,.3)}
.tl-m{position:absolute;top:86px;height:8px;width:1px;background:rgba(255,255,255,.4)}
.tl-ml{position:absolute;top:94px;font-size:11px;letter-spacing:2px;opacity:.75;text-transform:uppercase;transform:translateX(4px);white-space:nowrap}
.tl-today{position:absolute;top:2px;bottom:10px;width:1px;background:linear-gradient(transparent,rgba(255,183,3,.75))}
.tl-today b{position:absolute;top:92px;left:5px;font-size:10px;letter-spacing:2px;font-weight:400;color:#ffb703;text-transform:uppercase}
.tl-d{position:absolute;top:83px;width:7px;height:7px;margin-left:-3px;border-radius:50%;background:var(--c);box-shadow:0 0 8px 2px var(--c)}
.tl-c{position:absolute;height:20px;display:flex;align-items:center;gap:6px;padding:0 10px 0 8px;border-radius:99px;font-size:11px;white-space:nowrap;cursor:pointer;
  background:color-mix(in srgb,var(--c) 14%,rgba(8,12,20,.85));border:1px solid color-mix(in srgb,var(--c) 85%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--c) 38%,transparent);backdrop-filter:blur(6px);color:#fff}
.tl-c:hover{background:color-mix(in srgb,var(--c) 22%,rgba(8,12,20,.8))}
.tl-c i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c);flex:none}
.tl-c small{opacity:.55;font-size:10px}
.tl-c.late{border-color:#ff6b5e}.tl-c.late small{color:#ff9a8f;opacity:1}
/* tasks as stars */
.bubble.tstar{--s:60px;cursor:pointer}
.bubble.tstar .float{display:grid;place-items:center}
.tstar .core{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,#fff 0 30%,var(--c) 66%);
  box-shadow:0 0 12px 4px var(--c),0 0 36px 14px color-mix(in srgb,var(--c) 65%,transparent),0 0 80px 30px color-mix(in srgb,var(--c) 30%,transparent);
  animation:tstw 3.6s ease-in-out infinite alternate}
.tstar:nth-child(3n) .core{animation-duration:2.7s}.tstar:nth-child(3n+1) .core{animation-duration:4.4s}
@keyframes tstw{from{transform:scale(.85);opacity:.85}to{transform:scale(1.2);opacity:1}}
.tstar.done .core{background:radial-gradient(circle,#fff 0 40%,var(--c) 90%);opacity:.75;animation:none;box-shadow:0 0 10px 3px var(--c),0 0 28px 8px color-mix(in srgb,var(--c) 35%,transparent)}
.tstar:hover .core{transform:scale(1.5)}
.slabel{position:absolute;left:50%;bottom:calc(100% - 2px);transform:translateX(-50%) translateY(4px);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(8,12,20,.85);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);
  opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;color:var(--ink)}
.slabel small{opacity:.55;margin-left:6px;font-size:10px}
.tstar.show{z-index:15}
.tstar.show .slabel{opacity:1;transform:translateX(-50%)}
.trow{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0}
.trow .t-date{width:140px}
/* merged bubbles */
.refb{position:absolute;left:50%;top:7px;transform:translateX(-50%);font-size:11px;opacity:.75;pointer-events:none}
.mgb{margin:10px 0;padding:10px 12px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:10px;font-size:12px;line-height:1.5;opacity:.9;text-align:left}
#mgbox{margin:8px 0;text-align:left}
#mgl{max-height:150px;overflow-y:auto;margin-top:6px}
.mgi{padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer;opacity:.85}
.mgi:hover{background:rgba(255,255,255,.08);opacity:1}
.mgi small{opacity:.5}
/* linked (merged-in) planets */
.bubble.linkb{--s:104px;cursor:pointer;z-index:-1}
.linkb .float{opacity:.5;transition:opacity .3s}
.linkb:hover .float{opacity:.85}
.linkb .orb{border-style:dashed;border-color:color-mix(in srgb,var(--c) 55%,transparent);background:rgba(255,255,255,.015);box-shadow:none}
.linkb .label b{font-weight:400;font-size:12px}
.linkb .label small{opacity:.6}
/* drop a bubble into another */
.bubble.drop-on .orb{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 75%,transparent),0 0 46px color-mix(in srgb,var(--c) 55%,transparent);transform:scale(1.08)}
.bubble.gulp .orb{animation:gulp .55s .3s ease-out}
@keyframes gulp{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
#tlctl{position:fixed;top:160px;right:14px;z-index:8;display:flex;gap:2px;padding:2px;background:rgba(8,12,20,.85);border:1px solid rgba(255,255,255,.14);border-radius:9px;backdrop-filter:blur(8px)}
#tlctl button{background:none;border:0;border-radius:7px;padding:3px 9px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);opacity:.55}
#tlctl button:hover{opacity:.9}
#tlctl button.on{opacity:1;background:rgba(255,255,255,.13)}
.tl-dt{position:absolute;top:86px;width:1px;height:5px;background:rgba(255,255,255,.22)}
.tl-dl{position:absolute;top:94px;font-size:10px;opacity:.5;transform:translateX(3px);white-space:nowrap}
.tabs{display:flex;gap:4px;justify-content:center;margin-top:10px}
.tab{background:none;border:1px solid transparent;border-radius:6px;padding:4px 12px;font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.55}
.tab.on{opacity:1;border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.05)}
.todo{margin-top:8px;text-align:left}
.t-list{max-height:170px;overflow-y:auto}
.t-row{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid rgba(255,255,255,.06)}
.t-chk{accent-color:var(--c,var(--dc,#8fb8ff));width:15px;height:15px;flex:none}
.t-text{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);font:inherit;font-size:13px;padding:2px}
.t-date{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:6px;color:var(--ink);font:inherit;font-size:11px;padding:3px 6px;color-scheme:dark;width:122px;flex:none}
.t-del{background:none;border:0;opacity:.4;font-size:16px;line-height:1;flex:none}
.t-del:hover{opacity:1}
.t-row.done .t-text{text-decoration:line-through;opacity:.45}
.t-row.late .t-date{border-color:#ff6b5e;color:#ff9a8f}
.t-row.today .t-date{border-color:#ffb703;color:#ffd166}
.t-empty{opacity:.4;font-size:12px;padding:8px 2px}
.t-add{display:flex;gap:6px;margin-top:8px}
.t-new{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:6px;color:var(--ink);font:inherit;font-size:13px;padding:6px 8px;outline:0}
.t-new:focus{border-color:var(--c,var(--dc,#fff))}
.t-add button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:6px;width:30px;flex:none}
.tdc{position:absolute;left:12px;bottom:14px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;display:grid;place-items:center;font-size:11px;z-index:3;
  background:rgba(8,12,20,.7);border:1px solid color-mix(in srgb,var(--c) 70%,transparent)}
.tdc.late{border-color:#ff6b5e;color:#ff9a8f}
#notecard .tabs{margin:0;padding:6px 8px 0;justify-content:flex-start}
#noteTodo{padding:8px 14px 14px}
.lnk{position:absolute;right:14px;bottom:14px;width:22px;height:22px;display:grid;place-items:center;z-index:3;border-radius:50%;
  background:rgba(8,12,20,.7);border:1px solid color-mix(in srgb,var(--c) 70%,transparent);color:var(--ink);font-size:12px;text-decoration:none;cursor:pointer;transition:.2s}
.lnk:hover{background:var(--c);color:#05070b}
.lnk-in{margin-top:10px;font-size:13px;font-weight:400;text-align:left;padding:9px 12px}
#detail a{pointer-events:auto}
.dlink{display:inline-block;margin-top:10px;padding:5px 12px;border:1px solid color-mix(in srgb,var(--dc,#fff) 55%,transparent);border-radius:8px;color:var(--ink);text-decoration:none;font-size:11px;letter-spacing:2px;text-transform:uppercase;transition:.2s}
.dlink:hover{background:color-mix(in srgb,var(--dc,#fff) 20%,transparent)}
.noted{position:absolute;left:18px;top:18px;width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
#notecard{position:fixed;left:16px;bottom:16px;width:min(320px,calc(100vw - 32px));z-index:7;display:none;
  background:rgba(8,12,20,.78);border:1px solid rgba(255,255,255,.12);border-top:1px solid color-mix(in srgb,var(--dc,#fff) 65%,transparent);
  border-radius:10px;backdrop-filter:blur(12px);box-shadow:0 10px 40px rgba(0,0,0,.4)}
#noteHead{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:10px 14px;
  font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.8}
#noteHead:hover{opacity:1}
#noteHead::after{content:'+';font-size:15px;letter-spacing:0}
#notecard.open #noteHead::after{content:'–'}
#noteArea{display:block;width:100%;height:180px;resize:vertical;background:transparent;border:0;border-top:1px solid rgba(255,255,255,.08);
  color:var(--ink);font:inherit;font-size:13px;line-height:1.65;padding:12px 14px;outline:none;border-radius:0 0 10px 10px}
#noteBody{display:none}
#notecard.open #noteBody{display:block}
@media (max-width:760px){#notecard{bottom:190px}}
#hint{position:fixed;left:50%;top:72%;transform:translate(-50%,-50%);z-index:3;text-align:center;opacity:.55;pointer-events:none;
  display:none;line-height:1.6}
#hint b{font-size:20px}
.toast{position:fixed;left:50%;bottom:190px;transform:translateX(-50%);background:rgba(18,22,52,.95);padding:10px 16px;border-radius:99px;
  border:1px solid rgba(255,255,255,.2);z-index:80;animation:fade .3s}
@media (max-width:600px){:root{--s:96px;--sun:120px}.btn span{display:none}}
.wl h3{font-size:20px;letter-spacing:4px;text-transform:uppercase;font-weight:400;margin:0 0 6px}
.wl p{opacity:.7;font-size:13px;line-height:1.6;margin:0 0 14px}
.wl ul{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:9px;text-align:left}
.wl li{font-size:13px;line-height:1.5;padding-left:16px;position:relative;opacity:.9}
.wl li::before{content:'';position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--p0);box-shadow:0 0 8px var(--p0)}
.wl b{font-weight:600}
.wl .row{justify-content:center}
.wl-foot{margin-top:16px;font-size:11px;letter-spacing:1px;opacity:.4}
</style>
</head>
<body class="tl">
<div class="bg" id="bg">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>

<header>
  <div class="crumbs" id="crumbs"></div>
  <button class="btn" id="up" title="Zoom out (Esc / scroll down)">↑ <span>Zoom out</span></button>
  <div class="pal">
    <button class="btn" id="palBtn" title="Color palette">◐ <span>Palette</span></button>
    <div class="pal-menu" id="palMenu"></div>
  </div>
  <button class="btn" id="help" title="What is this?">?</button>
  <button class="btn" id="lf">Link file</button>
  <button class="btn" id="exp" title="Download backup">Save</button>
  <button class="btn" id="imp" title="Load backup">Load</button>
  <input type="file" id="file" accept=".json" hidden>
  <button class="btn primary" id="add">+ <span>Bubble</span></button>
</header>

<div id="timeline"></div>
<div id="tlctl"><button data-m="week">Week</button><button data-m="month">Month</button><button data-m="quarter">3 mo</button><button data-m="all">All</button></div>
<div id="detail"></div>
<div id="notecard"><button id="noteHead">Notes &amp; To-do</button><div id="noteBody"><div class="tabs"><button class="tab on" data-t="notes">Notes</button><button class="tab" data-t="todo">To-do</button></div><textarea id="noteArea" placeholder="Write anything about this bubble…"></textarea><div id="noteTodo"></div></div></div>
<div id="hint"><b>Nothing here yet</b><br>Double-click anywhere or press + to blow a bubble</div>
<main id="stage"></main>
<div id="hole"><div class="horizon"></div><span>DROP TO EDIT</span></div>

<script>
const KEY='orbit-v1';
const PALETTES={
  Spectrum:['#12d6ff','#3a7bff','#9b5cff','#ff4fd8','#ff3b5c','#ff8a1f','#ffd400','#3be36b'],
  Nebula:['#7c4dff','#00e5ff','#ff2d95','#536dfe','#1de9b6','#ff6e40','#b388ff','#40c4ff'],
  Aurora:['#00f5a0','#00d9f5','#7b61ff','#c04dff','#00e0b8','#4dffb0','#5aa9ff','#b8ff6a'],
  Ocean:['#00c6ff','#0072ff','#00d4aa','#4facfe','#0fd3d3','#2b5cff','#7ee8fa','#00e5ff'],
  Lagoon:['#00e5c3','#00b8ff','#2979ff','#00e676','#76ff03','#18ffff','#651fff','#ffea00'],
  Neon:['#00f5ff','#39ff14','#ff10f0','#fff700','#ff3131','#1f51ff','#bc13fe','#ff9100'],
  Cyber:['#ff2bd6','#00f0ff','#fcee0a','#7a5cff','#ff3366','#00ff9c','#ff8a00','#2d7bff'],
  Galaxy:['#6a5cff','#a259ff','#3dd5f3','#ff5fa2','#4f46e5','#22d3ee','#c084fc','#818cf8'],
  Sunset:['#ff7e5f','#feb47b','#ff4e50','#f9d423','#ff6a88','#c84b9e','#7b4397','#ffa751'],
  Solar:['#ffb300','#ff6d00','#ff3d00','#ffd54f','#ff8a65','#ff1744','#ffea00','#ffab40'],
  Ember:['#ff5a1f','#ff9f1c','#ff3b30','#ffcf33','#e63946','#ff7b54','#ffb347','#d62828'],
  Retro:['#ff6b35','#f7c548','#2ec4b6','#e71d36','#4d908e','#ff9f1c','#577590','#f9844a'],
  Forest:['#2dd36f','#7ed957','#00b894','#b2d235','#1fa87a','#f2c94c','#6fcf97','#a3e635'],
  Earth:['#e07a5f','#81b29a','#f2cc8f','#8d99ae','#e9c46a','#2a9d8f','#f4a261','#bc6c25'],
  Ice:['#a5f3fc','#7dd3fc','#93c5fd','#c4b5fd','#e0f2fe','#67e8f9','#bae6fd','#ddd6fe'],
  Mono:['#ffffff','#d4d4d8','#a1a1aa','#71717a','#e4e4e7','#bfc3ca','#8d939c','#f4f4f5']
};
const $=s=>document.querySelector(s);
const stage=$('#stage'), hole=$('#hole');
const uid=()=>Math.random().toString(36).slice(2,9);

function safeUrl(u){u=(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;try{const p=new URL(u);return /^https?:$/.test(p.protocol)?p.href:''}catch(e){return ''}}

function todayISO(){return new Date().toLocaleDateString('sv-SE')}
var IDX=null;
function reindex(){IDX=new Map();(function w(n){IDX.set(n.id,n);(n.children||[]).forEach(w)})(state.root)}
function real(n){let k=0;while(n&&n.ref&&k++<5){if(!IDX)reindex();const t=IDX.get(n.ref);if(!t||t===n)break;n=t}return n}
function pathTo(id){let out=null;(function w(n,p){if(out)return;const q=[...p,n];if(n.id===id){out=q;return}(n.children||[]).forEach(c=>w(c,q))})(state.root,[]);return out}
function goHash(n,fallback){const t=real(n);if(t!==n){const p=pathTo(t.id);if(p)return hashFor(p)}return hashFor(fallback)}
function mergeInto(a,t){
  t.children=t.children||[];t.todos=t.todos||[];
  t.children.push(...a.children);a.children=[];
  if(a.notes&&a.notes.trim()){t.notes=(t.notes&&t.notes.trim()?t.notes+'\n\n':'')+a.notes;a.notes=''}
  t.todos.push(...(a.todos||[]));a.todos=[];
  if(a.link&&!t.link)t.link=a.link;
  a.ref=t.id;a.auto=false;reindex();
}
const openCount=n=>(n.todos||[]).filter(t=>!t.done).length;
const lateCount=n=>(n.todos||[]).filter(t=>!t.done&&t.due&&t.due<todayISO()).length;
function todoPane(n,onChange){
  n.todos=n.todos||[];
  const wrap=document.createElement('div');wrap.className='todo';
  const list=document.createElement('div');list.className='t-list';
  const add=document.createElement('div');add.className='t-add';
  add.innerHTML='<input class="t-new" placeholder="Add a task…" maxlength="120"><input class="t-date" type="date" title="Due date"><button title="Add task">+</button>';
  wrap.append(list,add);
  const commit=()=>{save();if(onChange)onChange()};
  function draw(){
    list.innerHTML='';
    const t=todayISO(),key=x=>x.due||'9999-12-31';
    const items=[...n.todos].sort((a,b)=>(a.done-b.done)||(key(a)<key(b)?-1:key(a)>key(b)?1:0));
    items.forEach(it=>{
      const row=document.createElement('div');
      row.className='t-row'+(it.done?' done':'')+(!it.done&&it.due&&it.due<t?' late':'')+(!it.done&&it.due===t?' today':'');
      row.innerHTML='<input type="checkbox" class="t-chk"><input class="t-text" maxlength="120"><input type="date" class="t-date"><button class="t-del" title="Remove">×</button>';
      const [cb,tx,dt,del]=row.children;
      cb.checked=!!it.done;tx.value=it.text;dt.value=it.due||'';
      cb.onchange=()=>{it.done=cb.checked;commit();draw()};
      tx.oninput=()=>{it.text=tx.value;save()};
      dt.onchange=()=>{it.due=dt.value;commit();draw()};
      del.onclick=()=>{n.todos=n.todos.filter(x=>x!==it);commit();draw()};
      list.appendChild(row);
    });
    if(!items.length){const e=document.createElement('div');e.className='t-empty';e.textContent='No tasks yet';list.appendChild(e)}
  }
  const [tin,din,btn]=add.children;
  const addTask=()=>{const v=tin.value.trim();if(!v){tin.focus();return}n.todos.push({id:uid(),text:v,done:false,due:din.value||''});tin.value='';din.value='';commit();draw();tin.focus()};
  btn.onclick=addTask;tin.onkeydown=e=>{if(e.key==='Enter')addTask()};
  draw();return wrap;
}

/* ---------- data ---------- */
function mk(name,c,p,x,y,kids=[]){return{id:uid(),name,c,progress:p,auto:false,x,y,children:kids}}
function dayISO(n){const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE')}
function X(id,name,c,p,kids=[],o={}){return Object.assign({id,name,c,progress:p,auto:false,x:.5,y:.5,children:kids},o)}
function TT(text,due,done=false){return{id:uid(),text,done,due:due===null?'':dayISO(due)}}
function exampleSeed(){
  return{palette:'Spectrum',root:{id:'root',name:'Home',children:[
    X('guitar','Learn Guitar',2,0,[
      X('g1','Basic chords',1,100),X('g2','Strumming patterns',4,60),X('g3','First song',6,25),
      X('g4','Practice routine',0,0,[],{ref:'habit1'})
    ],{auto:true,notes:'Example note — every bubble can hold notes, a link and a to-do list.\n\nOpen this bubble\'s edit panel by dragging it onto the black hole.',link:'https://example.com',
       todos:[TT('Practice for 20 minutes',2),TT('Buy new strings',6),TT('Record a first video',17)]}),
    X('web','Website Project',4,0,[
      X('w1','Design',3,80),X('w2','Write content',5,40),
      X('w3','Buy a domain',7,0,[],{task:true,due:dayISO(9)})
    ],{auto:true,todos:[TT('Draft the landing page',4),TT('Ask a friend for feedback',12)]}),
    X('trip','Trip to Lisbon',1,0,[X('t1','Flights',2,100),X('t2','Hotel',5,50),X('t3','Itinerary',3,10)],
      {auto:true,todos:[TT('Book museum tickets',14),TT('Check the weather',25)]}),
    X('bday','Birthdays',6,0,[
      X('b1','Gift for Sam',4,0,[],{task:true,due:dayISO(5)}),
      X('b2','Plan the party',2,0,[],{task:true,due:dayISO(19)}),
      X('b3','Card for Alex',0,100,[],{task:true,due:dayISO(-2)})
    ],{auto:true}),
    X('habits','Daily Habits',7,0,[X('habit1','Practice routine',0,70),X('h2','Morning walk',3,45)],{auto:true}),
    X('read','Reading List',5,35)
  ]}}
}
function seed(){return{palette:'Spectrum',root:{id:'root',name:'Home',children:[]}}}
function fixAuto(n){if(n.children&&n.children.length){if(!n.auto&&!n.progress)n.auto=true;n.children.forEach(fixAuto)}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.root){fixAuto(s.root);return s}}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}if(window.fileSync)window.fileSync()}
let state=load()||exampleSeed();
function prog(n){if(n.ref){const t=real(n);if(t!==n)return prog(t)}return n.auto&&n.children.length?Math.round(n.children.reduce((a,c)=>a+prog(c),0)/n.children.length):(n.progress||0)}

/* ---------- palette ---------- */
function applyPalette(){
  if(!PALETTES[state.palette])state.palette='Spectrum';
  const p=PALETTES[state.palette];
  p.forEach((c,i)=>document.documentElement.style.setProperty('--p'+i,c));
  document.querySelectorAll('#palMenu button').forEach(b=>b.classList.toggle('on',b.dataset.n===state.palette));
}
function buildPalMenu(){
  const m=$('#palMenu');m.innerHTML='';
  Object.entries(PALETTES).forEach(([n,cols])=>{
    const b=document.createElement('button');b.dataset.n=n;
    b.innerHTML='<span class="dots">'+cols.slice(0,6).map(c=>`<i style="background:${c}"></i>`).join('')+'</span><span>'+n+'</span>';
    b.onclick=()=>{state.palette=n;save();applyPalette();m.classList.remove('open')};
    m.appendChild(b);
  });
}
$('#palBtn').onclick=e=>{e.stopPropagation();$('#palMenu').classList.toggle('open')};
document.addEventListener('click',()=>$('#palMenu').classList.remove('open'));

/* ---------- routing / zoom ---------- */
let trail=[state.root], token=0;
function hashFor(t){return '#/'+t.slice(1).map(n=>n.id).join('/')}
function goTo(t){const h=hashFor(t);if(location.hash===h||(h==='#/'&&!location.hash))route();else location.hash=h}
function route(first){
  const ids=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  const t=[state.root];
  for(const id of ids){const n=t[t.length-1].children.find(c=>c.id===id);if(!n)break;t.push(n)}
  const pre=(a,b)=>a.every((n,i)=>b[i]===n);
  const dir=t.length>trail.length&&pre(trail,t)?'in':t.length<trail.length&&pre(t,trail)?'out':(t.length!==trail.length||t.some((n,i)=>n!==trail[i]))?'warp':null;
  if(first||!dir){trail=t;closeOverlay();render();return}
  const my=++token;
  stage.className='leave-'+dir;
  setTimeout(()=>{
    if(my!==token)return;
    trail=t;closeOverlay();render();
    stage.className='enter-'+dir;
    setTimeout(()=>{if(my===token)stage.className=''},560);
  },320);
}
window.addEventListener('hashchange',()=>route());
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
let merging=false,mergeK=1;
function zoomOut(){if(trail.length<2||merging)return;if(REDUCED)goTo(trail.slice(0,-1));else merging=true}
$('#up').onclick=zoomOut;

let acc=0,accT;
document.addEventListener('wheel',e=>{
  if(e.ctrlKey)e.preventDefault();
  if($('#overlay')||trail.length<2||e.target.closest('#notecard'))return;
  if(e.deltaY>0){acc+=e.deltaY;clearTimeout(accT);accT=setTimeout(()=>acc=0,400);if(acc>260){acc=0;zoomOut()}}
  else acc=0;
},{passive:false});

/* ---------- render ---------- */
function cur(){return trail[trail.length-1]}
function render(popId){
  reindex();const c=cur();
  drawTimeline();
  merging=false;mergeK=1;
  stage.innerHTML='';
  const list=[...c.children,...backlinks(c),...(c.todos||[]).map(t=>({id:t.id,name:t.text||'(task)',c:c.c,progress:t.done?100:0,auto:false,children:[],task:true,due:t.due,_todo:t}))];
  const plan=planOrbits(list);
  stage.appendChild(drawRings(plan.rings));
  stage.appendChild(makeSun(c));
  list.forEach((n,i)=>{
    const el=makeBubble(n,n.id===popId),o=plan.items[i],t0=tMap.has(n.id)?tMap.get(n.id):o.t;
    if(offMap.has(n.id)){const q=offMap.get(n.id);el._p.ox=q[0];el._p.oy=q[1]}
    Object.assign(el._p,{t:t0,tT:o.t,w:o.w,ang:angMap.has(n.id)?angMap.get(n.id):o.ang,minA:plan.minA,maxA:plan.maxA,minB:plan.minB,maxB:plan.maxB});
    const a=plan.minA+(plan.maxA-plan.minA)*t0,b=plan.minB+(plan.maxB-plan.minB)*t0;
    el.style.transform=`translate(${(Math.cos(el._p.ang)*a+el._p.ox).toFixed(1)}px,${(Math.sin(el._p.ang)*b+el._p.oy).toFixed(1)}px)`;
    stage.appendChild(el);
  });
  $('#hint').style.display=list.length?'none':'block';
  $('#up').disabled=trail.length<2;
  const cr=$('#crumbs');cr.innerHTML='';
  trail.forEach((n,i)=>{
    if(i)cr.insertAdjacentHTML('beforeend','<span class="sep">›</span>');
    const b=document.createElement('button');b.textContent=n.name;
    if(i===trail.length-1)b.className='cur';else b.onclick=()=>goTo(trail.slice(0,i+1));
    cr.appendChild(b);
  });
  const d=$('#detail');
  if(trail.length>1){
    d.style.display='block';d.style.setProperty('--dc',`var(--p${c.c})`);
    d.innerHTML=`<small>${c.children.length} sub-bubble${c.children.length===1?'':'s'}</small>`;
        const lu=safeUrl(c.link);
    if(lu){const a=document.createElement('a');a.className='dlink';a.href=lu;a.target='_blank';a.rel='noopener';a.textContent='↗ '+new URL(lu).hostname.replace(/^www\./,'');const w=document.createElement('div');w.appendChild(a);d.appendChild(w)}
  }else d.style.display='none';
  updateNoteCard();
}

function allTodos(n,path,out){if(n.task&&n.due&&prog(n)<100)out.push({t:{text:n.name,due:n.due},n,path:path.slice(0,-1)});(n.todos||[]).forEach(t=>{if(!t.done&&t.due)out.push({t,n,path})});(n.children||[]).forEach(c=>allTodos(c,[...path,c],out));return out}
var tlMode='month';try{tlMode=localStorage.getItem('tl-mode-'+KEY)||'month'}catch(e){}
function paintTlCtl(){document.querySelectorAll('#tlctl button').forEach(b=>b.classList.toggle('on',b.dataset.m===tlMode))}

function attachDrag(el,n){

    const b=el.getBoundingClientRect(),offx=e.clientX-(b.left+b.width/2),offy=e.clientY-(b.top+b.height/2);

    let moved=false,tx=0,ty=0,isHot=false,dropT=null;
    const hr=hole.getBoundingClientRect(),hx=hr.left+hr.width/2,hy=hr.top+hr.height/2;
    const mv=ev=>{
      if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>5){moved=true;st.drag=true;el.classList.add('dragging');hole.classList.add('show')}
      if(!moved)return;
      const px=Math.min(r.width-s/2-6,Math.max(s/2+6,ev.clientX-offx-r.left)),py=Math.min(r.height-s/2-6,Math.max(s/2+6,ev.clientY-offy-r.top));
      tx=px-cx;ty=py-cy;
      el.style.transform=`translate(${tx}px,${ty}px)`;
      isHot=Math.hypot(r.left+px-hx,r.top+py-hy)<75;
      hole.classList.toggle('hot',isHot);
      let best=null,bd=1e9;
      if(!isHot)stage.querySelectorAll('.bubble:not(.tstar):not(.linkb)').forEach(o=>{if(o===el||o.classList.contains('ghost')||o.classList.contains('sucked'))return;const q=o.getBoundingClientRect(),d=Math.hypot(q.left+q.width/2-(r.left+px),q.top+q.height/2-(r.top+py));if(d<q.width*.42&&d<bd){bd=d;best=o}});
      if(best!==dropT){if(dropT)dropT.classList.remove('drop-on');if(best)best.classList.add('drop-on');dropT=best}
    };
    const up=()=>{
      el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);
      el.classList.remove('dragging');hole.classList.remove('show','hot');

      if(!moved){st.drag=false;if(n.task)openPanel(n,el);else location.hash=goHash(n,[...trail,n]);return}
      if(isHot){
        st.ox=tx-st.hx;st.oy=ty-st.hy;st.vx=st.vy=0;st.drag=false;
        openPanel(n,el);
      }else if(tgt){
        const tb=tgt.getBoundingClientRect(),tx2=tb.left+tb.width/2,ty2=tb.top+tb.height/2;
        el.classList.add('sucked');el.style.transform=`translate(${tx2-r.left-cx}px,${ty2-r.top-cy}px)`;
        tgt.classList.add('gulp');
        setTimeout(()=>{
          const par=cur(),tn=real(tgt._n);
          if(tn!==n&&par.children.includes(n)){
            par.children=par.children.filter(x=>x!==n);
            const was=tn.children.length;tn.children.push(n);if(!was&&!tn.progress)tn.auto=true;
            save();toast('"'+n.name+'" is now a sub-project of "'+tn.name+'"');
          }
          render();
        },620);
      }else{
        st.ox=tx-st.hx;st.oy=ty-st.hy;st.vx=st.vy=0;st.drag=false;
      }
    };
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  });
}

  const tabNotes=$$('.tab[data-t="notes"]'),tabTodo=$$('.tab[data-t="todo"]'),pNotes=$$('#pn-notes'),pTodo=$$('#pn-todo');
  const paintTab=()=>{const o=openCount(n);tabTodo.textContent='To-do'+(o?' · '+o:'')};
  pTodo.appendChild(todoPane(n,paintTab));paintTab();
  const showTab=t=>{tabNotes.classList.toggle('on',t==='notes');tabTodo.classList.toggle('on',t==='todo');pNotes.style.display=t==='notes'?'':'none';pTodo.style.display=t==='todo'?'':'none'};
  tabNotes.onclick=()=>showTab('notes');tabTodo.onclick=()=>showTab('todo');
  showTab((n.notes&&n.notes.trim())||!openCount(n)?'notes':'todo');
  const lk=$$('#lk'),go=$$('#go');
  const paintLink=()=>{const u=safeUrl(n.link);go.style.display=u?'':'none';if(u)go.href=u};
  lk.value=n.link||'';lk.oninput=e=>{n.link=e.target.value.trim();save();paintLink()};paintLink();
  $$('#nm').oninput=e=>{n.name=e.target.value||'Untitled'};
  $$('#rg').oninput=e=>{n.progress=+e.target.value;paint()};
  let dragging=false;
  const setFromPointer=e=>{
    const r=big.getBoundingClientRect();
    const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
    let deg=Math.atan2(dx,-dy)*180/Math.PI;if(deg<0)deg+=360;
    let p=Math.round(deg/360*100),old=n.progress;
    if(old>85&&p<15)p=100;else if(old<15&&p>85)p=0;
    n.progress=p;paint();
  };
  const svg=$$('svg');
  svg.addEventListener('pointerdown',e=>{if(n.auto)return;dragging=true;svg.setPointerCapture(e.pointerId);setFromPointer(e)});
  svg.addEventListener('pointermove',e=>{if(dragging)setFromPointer(e)});
  svg.addEventListener('pointerup',()=>dragging=false);
  $$('#sw').onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    n.c=+b.dataset.i;panel.style.setProperty('--c',`var(--p${n.c})`);
    $$('#sw').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  };
  const dn=$$('#dn'),due=$$('#due');
  if(dn){dn.checked=prog(n)>=100;dn.onchange=()=>{n.progress=dn.checked?100:0;n.auto=false;paint()}}
  if(due){due.value=n.due||'';due.onchange=()=>{n.due=due.value;save()}}
  $$('#tk').onclick=()=>{n.task=!n.task;if(n.task)n.auto=false;save();o.remove();render()};
  const tgt=real(n),isAlias=tgt!==n;
  const pathName=id=>(pathTo(id)||[]).slice(1).map(x=>x.name).join(' › ');
  if(isAlias){
    ['.tabs','#pn-notes','#pn-todo','#lk','#rg'].forEach(q=>{const e=$$(q);if(e)e.style.display='none'});
    $$('#go').style.display='none';
    const mb=$$('#mgb');mb.style.display='block';
    mb.textContent='⛓ Merged with: '+pathName(tgt.id)+'. Progress, notes, to-dos and sub-bubbles live in the original.';
    $$('#open').textContent='Open original';
    $$('#mg').textContent='Unlink';
    $$('#mg').onclick=()=>{n.progress=prog(tgt);delete n.ref;reindex();save();o.remove();render();toast('Unlinked — the moved notes and sub-bubbles stay in the original')};
  }else{
    const box=$$('#mgbox'),q=$$('#mgq'),l=$$('#mgl');
    const skip=new Set();(function w(x){skip.add(x.id);x.children.forEach(w)})(n);
    const cands=[];(function w(x,p){if(x!==state.root&&!skip.has(x.id)&&!x.ref&&!x.task)cands.push({x,label:[...p,x.name].join(' › ')});x.children.forEach(c=>w(c,x===state.root?[]:[...p,x.name]))})(state.root,[]);
    const draw=()=>{
      const k=q.value.trim().toLowerCase();l.innerHTML='';
      cands.filter(c=>!k||c.label.toLowerCase().includes(k)).slice(0,60).forEach(c=>{
        const d=document.createElement('div');d.className='mgi';d.textContent=c.label;
        d.onclick=()=>{if(!confirm('Merge "'+n.name+'" into "'+c.x.name+'"?\n\nThis bubble stays where it is, but opens and mirrors the other one. Its own notes, to-dos and sub-bubbles move into the other.'))return;
          mergeInto(n,c.x);save();o.remove();render();toast('Merged with '+c.x.name)};
        l.appendChild(d)});

function closeOverlayAndRender(){closeOverlay();render()}

/* ---------- new bubble ---------- */
function findSpot(){
  const r=stage.getBoundingClientRect(),s=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--s'))||124;
  const kids=cur().children;
  for(let i=0;i<60;i++){
    const x=(s/2+10+Math.random()*(r.width-s-20))/r.width, y=(r.height*.22+Math.random()*(r.height*.5))/r.height;
    if(kids.every(k=>Math.hypot((k.x-x)*r.width,(k.y-y)*r.height)>s*1.15))return{x,y};
  }
  return{x:.2+Math.random()*.6,y:.3+Math.random()*.4};
}
function openNew(at){
  closeOverlay();
  const o=document.createElement('div');o.id='overlay';
  let col=cur().children.length%8;
  o.innerHTML=`<div class="newcard" style="--c:var(--p${col})"><h3>New bubble</h3>
    <input class="name" id="nn" maxlength="40" placeholder="What is it called?">
    <div class="sw" id="sw">${swatches(col)}</div>
    <div class="row"><button class="btn" id="cx">Cancel</button><button class="btn primary" id="ok">Create</button></div></div>`;
  document.body.appendChild(o);
  const card=o.querySelector('.newcard'),inp=o.querySelector('#nn');
  inp.focus();
  o.querySelector('#sw').onclick=e=>{
    const b=e.target.closest('button');if(!b)return;col=+b.dataset.i;
    card.style.setProperty('--c',`var(--p${col})`);
    o.querySelectorAll('#sw button').forEach(x=>x.classList.toggle('on',x===b));
  };
  const make=()=>{
    const name=inp.value.trim();if(!name){inp.focus();return}
    const pos=at||findSpot();
    const n={id:uid(),name,c:col,progress:0,auto:true,x:pos.x,y:pos.y,children:[]};
    cur().children.push(n);save();o.remove();render(n.id);
  };
  o.querySelector('#ok').onclick=make;
  o.querySelector('#cx').onclick=()=>o.remove();
  inp.onkeydown=e=>{if(e.key==='Enter')make()};
  o.addEventListener('pointerdown',e=>{if(e.target===o)o.remove()});
}
$('#add').onclick=()=>openNew();

/* ---------- file autosave (Chrome / Edge / Brave) ---------- */
var fh=null,fT=0;
(function(){
  const btn=$('#lf');
  if(!window.showSaveFilePicker){btn.style.display='none';return}
  const FK='file-'+KEY;
  const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('bubbles-fs',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const idbSet=async v=>{try{const d=await idb();const t=d.transaction('h','readwrite');v?t.objectStore('h').put(v,FK):t.objectStore('h').delete(FK)}catch(e){}};
  const idbGet=async()=>{try{const d=await idb();return await new Promise(r=>{const q=d.transaction('h').objectStore('h').get(FK);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}};
  function paint(m){
    btn.classList.toggle('on',m==='on');
    btn.textContent=m==='on'?'● '+(fh&&fh.name||'file'):m==='ask'?'Reconnect file':'Link file';
    btn.title=m==='on'?'Autosaving to this file · click to stop':m==='ask'?'Click to resume autosaving to your file':'Autosave to a file on your computer';
  }
  window.fileSync=function(){
    if(!fh)return;clearTimeout(fT);
    fT=setTimeout(async()=>{try{const w=await fh.createWritable();await w.write(JSON.stringify(state,null,2));await w.close();paint('on')}catch(e){paint('ask')}},400);
  };
  const apply=s=>{fixAuto(s.root);state=s;save();trail=[state.root];location.hash='#/';applyPalette();render()};
  const readFile=async()=>{try{const t=await (await fh.getFile()).text();if(!t.trim())return null;const s=JSON.parse(t);return s&&s.root?s:null}catch(e){return null}};
  btn.onclick=async()=>{
    try{
      if(fh&&btn.classList.contains('on')){
        if(confirm('Stop autosaving to "'+fh.name+'"? Your bubbles stay saved in this browser.')){fh=null;idbSet(null);paint('off')}
        return;
      }
      if(fh){ // stored handle, needs permission
        if(await fh.requestPermission({mode:'readwrite'})==='granted'){
          const s=await readFile();if(s)apply(s);else window.fileSync();
          paint('on');toast('Autosave on');
        }
        return;
      }
      const h=await showSaveFilePicker({suggestedName:'bubbles-data.json',types:[{description:'Bubbles data',accept:{'application/json':['.json']}}]});
      fh=h;
      const s=await readFile();
      if(s&&confirm('This file already contains bubbles.\n\nOK = load them here\nCancel = replace the file with what is on screen'))apply(s);
      else window.fileSync();
      idbSet(h);paint('on');toast('Autosaving to '+h.name);
    }catch(e){if(e&&e.name!=='AbortError')toast('Could not link that file')}
  };
  (async()=>{
    const h=await idbGet();if(!h){paint('off');return}
    fh=h;
    try{
      if(await h.queryPermission({mode:'readwrite'})==='granted'){const s=await readFile();if(s)apply(s);paint('on')}
      else paint('ask');
    }catch(e){paint('ask')}
  })();
})();


/* ---------- starfield ---------- */
const layers=[];
(function(){
  const bg=$('#bg');
  [[60,1.1,.4],[26,1.5,.8],[8,2,1.4]].forEach(([count,size,depth])=>{
    const L=document.createElement('div');L.className='layer';L._d=depth;
    for(let i=0;i<count;i++){
      const d=document.createElement('div'),sz=size*(.5+Math.random());
      const tint='#cfd8e6';
      d.className='star';
      d.style.cssText=`width:${sz.toFixed(1)}px;height:${sz.toFixed(1)}px;left:${Math.random()*100}%;top:${Math.random()*100}%;background:${tint};animation-duration:${(2+Math.random()*5).toFixed(1)}s;animation-delay:-${(Math.random()*6).toFixed(1)}s`;
      L.appendChild(d);
    }
    bg.appendChild(L);layers.push(L);
  });
  setInterval(()=>{
    if(document.hidden)return;
    const d=document.createElement('div'),ang=18+Math.random()*28,len=300+Math.random()*260,rad=ang*Math.PI/180;
    d.className='shoot';
    d.style.cssText=`left:${Math.random()*innerWidth*.7}px;top:${Math.random()*innerHeight*.4}px;--r:${ang}deg;--dx:${Math.cos(rad)*len}px;--dy:${Math.sin(rad)*len}px`;
    bg.appendChild(d);setTimeout(()=>d.remove(),1500);
  },16000);
})();

/* ---------- slow space drift + cursor stirring ---------- */
const mouse={x:-9999,y:-9999,vx:0,vy:0,on:false,t:0};
document.addEventListener('pointermove',e=>{
  const now=performance.now(),dt=Math.max(8,now-mouse.t)/1000;
  if(mouse.on){mouse.vx=mouse.vx*.7+((e.clientX-mouse.x)/dt)*.3;mouse.vy=mouse.vy*.7+((e.clientY-mouse.y)/dt)*.3}
  mouse.x=e.clientX;mouse.y=e.clientY;mouse.t=now;mouse.on=true;
});
document.documentElement.addEventListener('mouseleave',()=>{mouse.on=false});
let lastT=performance.now(),T=0,parX=0,parY=0;
function tick(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;T+=dt;
  mouse.vx*=Math.exp(-4*dt);mouse.vy*=Math.exp(-4*dt);
  const R=180,sr={width:stage.clientWidth,height:stage.clientHeight},cx=sr.width/2,cy=sr.height/2;
  if(merging)mergeK=Math.max(0,mergeK-dt*2.2);
  stage.querySelectorAll('.bubble').forEach(el=>{
    const st=el._p,n=el._n;if(!st)return;
    st.ang+=st.w*dt;angMap.set(n.id,st.ang);
    st.t+=(st.tT-st.t)*Math.min(1,dt*2.4);tMap.set(n.id,st.t);
    const oa=st.minA+(st.maxA-st.minA)*st.t,ob=st.minB+(st.maxB-st.minB)*st.t;
    st.hx=Math.cos(st.ang)*oa*mergeK;st.hy=Math.sin(st.ang)*ob*mergeK;
    const b0=el.getBoundingClientRect(),px=b0.left+b0.width/2,py=b0.top+b0.height/2;
    if(st.px!==undefined&&dt>0){
      const vx=(px-st.px)/dt,vy=(py-st.py)/dt,ax=(vx-st.pvx)/dt,ay=(vy-st.pvy)/dt;
      st.pvx=vx;st.pvy=vy;
      const f=Math.min(1,dt*10);
      st.aF+=(Math.max(-4000,Math.min(4000,ax))-st.aF)*f;
      st.ayF+=(Math.max(-4000,Math.min(4000,ay))-st.ayF)*f;
      st.vxF+=(vx-st.vxF)*Math.min(1,dt*6);
      const th0=st.vxF*.05+Math.sin(T*.9+st.seed)*1.2;
      st.tw+=(-45*(st.th-th0)-3.2*st.tw+st.aF*.05)*dt;
      st.th=Math.max(-22,Math.min(22,st.th+st.tw*dt));
      st.th2+=(st.th*.7-st.th2)*Math.min(1,dt*3);
      st.lw+=(-60*st.lift-4*st.lw+st.ayF*.012)*dt;
      st.lift=Math.max(-7,Math.min(7,st.lift+st.lw*dt));
      el.style.setProperty('--tilt',st.th.toFixed(2)+'deg');
      el.style.setProperty('--tilt2',st.th2.toFixed(2)+'deg');
      el.style.setProperty('--lift',st.lift.toFixed(2)+'px');
    }
    st.px=px;st.py=py;
    placeMoons(el,dt);
    if(st.drag||el.classList.contains('sucked')||el.classList.contains('ghost'))return;
    let ax=Math.sin(T*.23+st.seed)*7+Math.sin(T*.11+st.seed*2.3)*5;
    let ay=Math.cos(T*.19+st.seed*1.7)*7+Math.cos(T*.13+st.seed)*5;
    ax-=st.ox*.5;ay-=st.oy*.5;
    if(mouse.on){
      const b=el.getBoundingClientRect(),dx=b.left+b.width/2-mouse.x,dy=b.top+b.height/2-mouse.y,d=Math.hypot(dx,dy)||1;
      if(d<R){
        const f=1-d/R;
        ax+=mouse.vx*f*1.5+dx/d*f*f*260;
        ay+=mouse.vy*f*1.5+dy/d*f*f*260;
      }
    }
    st.vx+=ax*dt;st.vy+=ay*dt;
    const damp=Math.exp(-1.4*dt);st.vx*=damp;st.vy*=damp;
    const sp=Math.hypot(st.vx,st.vy);if(sp>170){st.vx*=170/sp;st.vy*=170/sp}
    st.ox+=st.vx*dt;st.oy+=st.vy*dt;
    const sz=el.offsetWidth;
    st.ox=Math.max(sz/2+4-cx-st.hx,Math.min(sr.width-sz/2-4-cx-st.hx,st.ox));
    st.oy=Math.max(sz/2+4-cy-st.hy,Math.min(sr.height-sz/2-4-cy-st.hy,st.oy));
    if(!merging)offMap.set(n.id,[st.ox,st.oy]);
    const k=merging?mergeK:1;
    el.style.transform=`translate(${(st.hx+st.ox*k).toFixed(1)}px,${(st.hy+st.oy*k).toFixed(1)}px)${merging?` scale(${(.35+.65*k).toFixed(3)})`:''}`;
    if(merging)el.style.opacity=Math.max(0,k*1.3-.3).toFixed(2);
  });
  if(merging&&mergeK<=0){merging=false;location.hash=hashFor(trail.slice(0,-1))}
  const tx=mouse.on?(mouse.x/innerWidth-.5)*-22:0,ty=mouse.on?(mouse.y/innerHeight-.5)*-22:0;
  parX+=(tx-parX)*.03;parY+=(ty-parY)*.03;
  layers.forEach(L=>{L.style.transform=`translate(${(parX*L._d+Math.sin(T*.04+L._d)*10).toFixed(1)}px,${(parY*L._d+Math.cos(T*.035+L._d)*8).toFixed(1)}px)`});
  requestAnimationFrame(tick);
}
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(tick);

let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!$('#overlay'))render()},200)});

buildPalMenu();applyPalette();route(true);
</script>
